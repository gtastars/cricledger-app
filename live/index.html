<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CricLedger Live</title>
<meta name="theme-color" content="#0A1120" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: #0a1120; --surface: #111b2f; --raised: #17233b; --border: #22314d;
    --text: #edf1f8; --muted: #a9b5cb; --faint: #8794ad; --gold: #f2c14e; --blue: #8fb3ff; --red: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; }
  body { background: radial-gradient(110% 80% at 90% -10%, rgba(54,96,190,.45), transparent 55%), var(--ground); }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; padding: max(16px, 2.2vmin); gap: 2vmin; }
  .top { display: flex; align-items: center; gap: 12px; }
  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(18px, 3vmin, 34px); letter-spacing: -.02em; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: .35em .8em; border-radius: 999px; font-weight: 700; font-size: clamp(11px, 1.6vmin, 18px); letter-spacing: .08em;
    background: rgba(229,72,77,.16); border: 1px solid rgba(255,122,122,.4); color: #ffb3b6; }
  .pill i { width: .6em; height: .6em; border-radius: 50%; background: #ff4d55; animation: pulse 1.4s infinite; }
  .pill.off { background: rgba(243,181,74,.14); border-color: rgba(243,181,74,.4); color: #f8cf7d; }
  .pill.off i { background: #f3b54a; }
  @keyframes pulse { 50% { opacity: .25; } }
  .teams { margin-left: auto; color: var(--muted); font-weight: 500; font-size: clamp(12px, 2vmin, 24px); text-align: right; }
  .main { flex: 1; display: grid; gap: 3vmin; grid-template-columns: 1fr; align-content: center; }
  @media (orientation: landscape) and (min-width: 700px) { .main { grid-template-columns: 1.25fr 1fr; align-items: center; } }
  .eyebrow { color: var(--gold); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: clamp(12px, 2.4vmin, 28px); }
  .score { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; line-height: .95; letter-spacing: -.04em; font-size: clamp(84px, 22vmin, 300px); }
  .score small { font-weight: 700; color: var(--muted); font-size: .55em; letter-spacing: -.02em; }
  .overs { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: clamp(20px, 4.5vmin, 56px); }
  .overs span { color: var(--muted); font-family: "DM Sans"; font-weight: 500; font-size: .6em; }
  .chase { margin-top: 2vmin; display: inline-flex; flex-wrap: wrap; gap: .6em 1.2em; align-items: baseline; padding: .55em .9em; border-radius: 14px;
    background: rgba(242,193,78,.10); border: 1px solid rgba(242,193,78,.28); font-size: clamp(14px, 3vmin, 38px); }
  .chase b { color: #f6d68a; } .chase span { color: var(--muted); font-size: .75em; }
  .result { margin-top: 2vmin; color: var(--gold); font-family: "Bricolage Grotesque"; font-weight: 800; font-size: clamp(22px, 5vmin, 60px); }
  .first { margin-top: 1.2vmin; color: var(--muted); font-size: clamp(13px, 2.4vmin, 28px); }
  .panel { background: linear-gradient(180deg, #13203a, #111b2f); border: 1px solid var(--border); border-radius: 18px; padding: clamp(14px, 2.6vmin, 30px); }
  .row { display: flex; align-items: center; gap: .6em; font-size: clamp(16px, 3.4vmin, 42px); font-weight: 700; padding: .2em 0; }
  .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v { font-family: "Bricolage Grotesque"; }
  .row .dot { width: .45em; height: .45em; border-radius: 50%; background: var(--gold); flex: none; }
  .row .gap { width: .45em; flex: none; }
  .row.bowler .dot { background: var(--blue); }
  hr { border: 0; border-top: 1px solid var(--border); margin: .5em 0; }
  .label { color: var(--faint); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: clamp(11px, 1.9vmin, 22px); margin-bottom: 1.4vmin; }
  .balls { display: flex; flex-wrap: wrap; gap: 1.2vmin; }
  .ball { min-width: clamp(34px, 7vmin, 84px); height: clamp(34px, 7vmin, 84px); padding: 0 .4em; border-radius: 999px; display: grid; place-items: center;
    font-weight: 700; font-size: clamp(13px, 2.6vmin, 32px); background: var(--raised); border: 1px solid rgba(255,255,255,.12); }
  .ball.run { background: #1e2d4a; } .ball.four { background: #2d5bd2; } .ball.six { background: #1f8a5b; } .ball.wicket { background: var(--red); }
  .ball.extra { background: #2a2212; border-color: #5c4a1c; color: #f8cf7d; }
  .ball.empty { background: transparent; border: 1px dashed #34476a; }
  .foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; color: var(--faint); font-size: clamp(11px, 1.7vmin, 18px); }
  .foot img { width: 1.9em; height: 1.9em; }
  .flash { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .flash div { font-family: "Bricolage Grotesque"; font-weight: 800; color: #fff; letter-spacing: .06em; font-size: clamp(56px, 16vmin, 200px);
    padding: .1em .45em; border-radius: 22px; animation: pop 2.4s ease forwards; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 12% { transform: scale(1.05); opacity: 1 } 20% { transform: scale(1) } 85% { opacity: 1 } 100% { opacity: 0 } }
  .center { flex: 1; display: grid; place-items: center; text-align: center; gap: 16px; }
  .codebox { display: flex; gap: 10px; justify-content: center; }
  input { width: 9ch; font: 800 42px "Bricolage Grotesque"; letter-spacing: .25em; text-align: center; text-transform: uppercase; color: var(--gold);
    background: #0d1628; border: 1.5px solid rgba(242,193,78,.35); border-radius: 16px; padding: 12px 8px; }
  button { font: 700 18px "DM Sans"; color: #17120a; background: linear-gradient(#f7cf63, #e8b034); border: 1px solid #d9a42b; border-radius: 12px; padding: 0 22px; cursor: pointer; }
  .muted { color: var(--muted); }
  .fs { position: fixed; top: 10px; right: 12px; background: transparent; border: 0; color: var(--faint); font-size: 20px; padding: 6px; opacity: .5; }
  /* Phones held upright: fill the screen, big score */
  @media (orientation: portrait) {
    .main { align-content: space-evenly; gap: 5vh; }
    .eyebrow { font-size: 4.6vw; }
    .score { font-size: 36vw; }
    .overs { font-size: 9vw; }
    .chase, .first { font-size: 5vw; }
    .result { font-size: 8vw; }
    .row { font-size: 6vw; }
    .label { font-size: 4vw; }
    .balls { gap: 2vw; flex-wrap: nowrap; }
    .ball { min-width: 11.5vw; height: 11.5vw; font-size: 5.2vw; padding: 0 .25em; }
    .panel { padding: 5vw; border-radius: 22px; }
    .brand { font-size: 6vw; } .pill { font-size: 3.4vw; } .teams { font-size: 3.6vw; }
    input { font-size: 9vw; width: 100%; max-width: 11ch; }
    .codebox { flex-wrap: wrap; padding: 0 4vw; }
    button { min-height: 56px; }
  }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script type="module">
  // Public config: identifies the project only. Security is in the database rules (read-only for viewers).
  const EMU = new URLSearchParams(location.search).get("emu") === "1"; // local testing only
  const prodConfig = {
    apiKey: "AIzaSyDD8emptvyNkyBpqxOAT3jWwLd1R1Wi6VY",
    authDomain: "cricledger-live.firebaseapp.com",
    databaseURL: "https://cricledger-live-default-rtdb.firebaseio.com",
    projectId: "cricledger-live",
    appId: "1:332365833020:web:195cddff3b2cc3a4773439",
  };
  const firebaseConfig = EMU
    ? { apiKey: "demo-key", projectId: "demo-cricledger", databaseURL: "http://127.0.0.1:9000?ns=demo-cricledger-default-rtdb", appId: "demo" }
    : prodConfig;

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ov = (b) => `${Math.floor(b / 6)}.${b % 6}`;
  const crr = (r, b) => (b ? (r / (b / 6)).toFixed(2) : "0.00");
  const app = document.getElementById("app");
  let online = true;
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  const crest = "gta-stars.png";

  function askForCode(msg) {
    app.replaceChildren($(`
      <div class="top"><div class="brand">CricLedger <span class="muted" style="font-weight:600">Live</span></div></div>
      <div class="center"><div>
        <div class="eyebrow">Watch a match</div>
        <p class="muted">${esc(msg || "Type the 6-letter code from the scorer's phone.")}</p>
        <form class="codebox" id="f"><input id="c" maxlength="6" autocomplete="off" autofocus placeholder="ABC123" /><button>Watch</button></form>
      </div></div>`));
    document.getElementById("f").onsubmit = (e) => {
      e.preventDefault();
      const v = document.getElementById("c").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (v.length === 6) location.search = `?c=${v}${EMU ? "&emu=1" : ""}`;
    };
  }

  if (!firebaseConfig.databaseURL) { askForCode("Live scores are being set up. Check back soon."); }
  else if (!code) { askForCode(); }
  else start();

  function start() {
    const db = getDatabase(initializeApp(firebaseConfig));
    let last = null, lastKey = "";
    const me = push(ref(db, `viewers/${code}`)); set(me, true); onDisconnect(me).remove();
    onValue(ref(db, ".info/connected"), (s) => { online = s.val() === true; if (last) render(last); });
    onValue(ref(db, `live/${code}`), (snap) => {
      const s = snap.val();
      if (!s) { askForCode(`No live match with code ${code}. Check the code with the scorer.`); last = null; return; }
      const key = `${s.inn}-${s.balls}-${s.runs}-${s.wkts}-${(s.over || []).length}`;
      const fresh = last && key !== lastKey;
      last = s; lastKey = key; render(s);
      if (fresh && s.flash) flash(s.flash);
    }, () => askForCode("Couldn't connect. Check your internet and refresh."));
  }

  function flash(text) {
    const bg = text === "WICKET" ? "#e5484d" : text === "SIX" ? "#1f8a5b" : "#2d5bd2";
    const el = $(`<div class="flash"><div style="background:${bg}">${esc(text)}</div></div>`).firstElementChild;
    document.body.append(el); setTimeout(() => el.remove(), 2500);
  }

  function render(s) {
    const over = s.over || [];
    const legal = over.filter((b) => b.k !== "extra" || /b$/.test(b.l)).length;
    const balls = over.map((b) => `<div class="ball ${b.k}">${esc(b.l)}</div>`).join("") +
      Array.from({ length: Math.max(0, 6 - legal) }).map(() => `<div class="ball empty"></div>`).join("");
    let chase = "";
    if (s.inn === 2 && s.target && !s.result) {
      const need = Math.max(0, s.target - s.runs), left = Math.max(0, s.overs * 6 - s.balls);
      chase = `<div class="chase"><b>${need > 0 ? `Need ${need} off ${left}` : "Target reached"}</b><span>Target ${s.target}${need > 0 && left ? ` · RRR ${(need / (left / 6)).toFixed(2)}` : ""}</span></div>`;
    }
    const status = !online ? ["off", "RECONNECTING"] : s.status === "done" ? ["", "FINAL"] : s.status === "break" ? ["", "INNINGS BREAK"] : ["", "LIVE"];
    const players = s.mode === "full" ? `
      <div class="panel">
        <div class="row"><span class="${s.striker ? "dot" : "gap"}"></span><span class="n">${esc(s.striker?.n ?? "—")}</span><span class="v num">${s.striker ? `${s.striker.r} (${s.striker.b})` : ""}</span></div>
        <div class="row"><span class="gap"></span><span class="n">${esc(s.non?.n ?? "—")}</span><span class="v num">${s.non ? `${s.non.r} (${s.non.b})` : ""}</span></div>
        <hr/>
        <div class="row bowler"><span class="${s.bowler ? "dot" : "gap"}"></span><span class="n">${esc(s.bowler?.n ?? "Bowler to come")}</span><span class="v num">${s.bowler ? `${s.bowler.o}-${s.bowler.r}-${s.bowler.w}` : ""}</span></div>
      </div>` : "";
    app.replaceChildren($(`
      <div class="top">
        <div class="brand">CricLedger</div>
        <span class="pill ${status[0]}"><i></i>${status[1]}</span>
        <div class="teams">${esc(s.teamA)} v ${esc(s.teamB)} · ${s.overs} overs</div>
      </div>
      <div class="main">
        <div>
          <div class="eyebrow">${esc(s.bat)} · ${s.inn === 1 ? "1st innings" : "2nd innings"}</div>
          <div class="score num">${s.runs}<small>/${s.wkts}</small></div>
          <div class="overs num">${ov(s.balls)} <span>of ${s.overs} overs · CRR ${crr(s.runs, s.balls)}</span></div>
          ${s.result ? `<div class="result">${esc(s.result)}</div>` : chase}
          ${s.first ? `<div class="first">${esc(s.first.team)} ${s.first.runs}/${s.first.wkts} (${ov(s.first.balls)})</div>` : ""}
        </div>
        <div style="display:grid;gap:3vmin">
          ${players}
          <div class="panel"><div class="label">${esc(s.overLabel || "This over")}</div><div class="balls">${balls}</div></div>
        </div>
      </div>
      <div class="foot">Powered by <img src="${crest}" alt=""/> <b>GTA Stars</b> · match ${esc(code)}</div>
      <button class="fs" title="Full screen" onclick="document.documentElement.requestFullscreen?.()">⛶</button>`));
  }
</script>
</body>
</html>
